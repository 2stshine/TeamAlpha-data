name: Inspect FMP commodity backfill

on:
  workflow_dispatch:
    inputs:
      since_minutes:
        description: CloudWatch lookback window in minutes
        required: true
        default: "30"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show commodity backfill progress
        env:
          SINCE_MINUTES: ${{ inputs.since_minutes }}
        run: |
          set -euo pipefail
          DEFAULT_FAMILY="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')-daily-full"
          ECS_TASK_FAMILY="${ECS_TASK_FAMILY:-${DEFAULT_FAMILY}}"
          CONTAINER_NAME="${CONTAINER_NAME:-${ECS_TASK_FAMILY}}"
          LOG_GROUP="$(
            aws ecs describe-task-definition \
              --task-definition "${ECS_TASK_FAMILY}" \
              --query "taskDefinition.containerDefinitions[?name=='${CONTAINER_NAME}'].logConfiguration.options.\"awslogs-group\" | [0]" \
              --output text
          )"
          test -n "${LOG_GROUP}" && test "${LOG_GROUP}" != "None"
          START_TIME="$(( $(date -u +%s) * 1000 - SINCE_MINUTES * 60000 ))"
          aws logs filter-log-events \
            --log-group-name "${LOG_GROUP}" \
            --start-time "${START_TIME}" \
            --filter-pattern '"[fmp-backfill-ecs]"' \
            --query 'events[].{timestamp:timestamp,message:message}' \
            --output json \
            | jq -r '.[] | "\(.timestamp)\t\(.message)"'
