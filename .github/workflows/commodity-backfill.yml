name: Backfill FMP commodities

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: First history year
        required: true
        default: "2015"
      to_year:
        description: Last history year
        required: true
        default: "2026"

permissions:
  contents: read
  id-token: write

concurrency:
  group: fmp-commodity-backfill
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  SCHEDULE_NAME: ${{ vars.SCHEDULE_NAME }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve production resources
        run: |
          set -euo pipefail
          DEFAULT_FAMILY="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')-daily-full"
          ECS_TASK_FAMILY="${ECS_TASK_FAMILY:-${DEFAULT_FAMILY}}"
          CONTAINER_NAME="${CONTAINER_NAME:-${ECS_TASK_FAMILY}}"
          SCHEDULE_NAME="${SCHEDULE_NAME:-${ECS_TASK_FAMILY}-tue-sat-0830-kst}"
          {
            echo "ECS_TASK_FAMILY=${ECS_TASK_FAMILY}"
            echo "CONTAINER_NAME=${CONTAINER_NAME}"
            echo "SCHEDULE_NAME=${SCHEDULE_NAME}"
          } >> "${GITHUB_ENV}"

      - name: Register one-off task definition
        id: task
        env:
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_FAMILY}" \
            --query taskDefinition --output json > current.json
          jq \
            --arg container "${CONTAINER_NAME}" \
            --arg from_year "${FROM_YEAR}" \
            --arg to_year "${TO_YEAR}" \
            '
            {
              family, taskRoleArn, executionRoleArn, networkMode,
              containerDefinitions, volumes, placementConstraints,
              requiresCompatibilities, cpu, memory, runtimePlatform,
              ephemeralStorage, ipcMode, pidMode, proxyConfiguration,
              inferenceAccelerators
            }
            | with_entries(select(.value != null and .value != [] and .value != {}))
            | .containerDefinitions |= map(
                if .name == $container then
                  .entryPoint = ["uv","run","python","-m","pipeline.fmp_backfill_ecs"]
                  | .command = ["--phase","commodities","--from",$from_year,"--to",$to_year]
                else . end
              )
            ' current.json > one-off.json
          TASK_DEFINITION_ARN="$(
            aws ecs register-task-definition \
              --cli-input-json file://one-off.json \
              --query taskDefinition.taskDefinitionArn --output text
          )"
          echo "task_definition_arn=${TASK_DEFINITION_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Start and wait for commodity backfill
        env:
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          aws scheduler get-schedule \
            --name "${SCHEDULE_NAME}" --output json > schedule.json
          jq '.Target' schedule.json > target.json
          SCHEDULE_GROUP="$(jq -r '.GroupName // "default"' schedule.json)"
          ORIGINAL_EXPRESSION="$(jq -r '.ScheduleExpression' schedule.json)"
          ORIGINAL_TIMEZONE="$(jq -r '.ScheduleExpressionTimezone // "UTC"' schedule.json)"
          ORIGINAL_STATE="$(jq -r '.State' schedule.json)"
          RESTORED=false
          restore_schedule() {
            if [[ "${RESTORED}" == "true" ]]; then return; fi
            aws scheduler update-schedule \
              --name "${SCHEDULE_NAME}" \
              --group-name "${SCHEDULE_GROUP}" \
              --schedule-expression "${ORIGINAL_EXPRESSION}" \
              --schedule-expression-timezone "${ORIGINAL_TIMEZONE}" \
              --flexible-time-window '{"Mode":"OFF"}' \
              --target file://target.json \
              --state "${ORIGINAL_STATE}" > /dev/null
            RESTORED=true
            echo "Restored ${SCHEDULE_NAME} to ${ORIGINAL_EXPRESSION}"
          }
          trap restore_schedule EXIT

          jq \
            --arg task_definition "${TASK_DEFINITION_ARN}" \
            '.EcsParameters.TaskDefinitionArn = $task_definition' \
            target.json > one-off-target.json
          CLUSTER_ARN="$(jq -r '.Arn' target.json)"
          STARTED_AFTER="$(date -u +%s)"
          RUN_AT="$(date -u -d '+90 seconds' '+%Y-%m-%dT%H:%M:%S')"
          aws scheduler update-schedule \
            --name "${SCHEDULE_NAME}" \
            --group-name "${SCHEDULE_GROUP}" \
            --schedule-expression "at(${RUN_AT})" \
            --schedule-expression-timezone UTC \
            --flexible-time-window '{"Mode":"OFF"}' \
            --target file://one-off-target.json \
            --state ENABLED > /dev/null
          echo "Scheduled one-off task at ${RUN_AT} UTC"

          TASK_ARN=""
          for _ in $(seq 1 45); do
            task_arns="$({
              aws ecs list-tasks --cluster "${CLUSTER_ARN}" \
                --family "${ECS_TASK_FAMILY}" --desired-status RUNNING \
                --query 'taskArns' --output text
              aws ecs list-tasks --cluster "${CLUSTER_ARN}" \
                --family "${ECS_TASK_FAMILY}" --desired-status STOPPED \
                --query 'taskArns' --output text
            } | tr '\t ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')"
            if [[ -n "${task_arns}" ]]; then
              TASK_ARN="$(
                aws ecs describe-tasks --cluster "${CLUSTER_ARN}" \
                  --tasks ${task_arns} --output json \
                | jq -r \
                    --arg task_definition "${TASK_DEFINITION_ARN}" \
                    --argjson started_after "${STARTED_AFTER}" \
                    '.tasks[]
                     | select(.taskDefinitionArn == $task_definition)
                     | select((.createdAt | fromdateiso8601) >= $started_after)
                     | .taskArn' \
                | head -1
              )"
            fi
            if [[ -n "${TASK_ARN}" ]]; then break; fi
            sleep 10
          done
          if [[ -z "${TASK_ARN}" ]]; then
            echo "Scheduler did not start the one-off ECS task" >&2
            exit 1
          fi
          restore_schedule
          echo "Started ${TASK_ARN}"
          for _ in $(seq 1 180); do
            STATUS="$(
              aws ecs describe-tasks --cluster "${CLUSTER_ARN}" \
                --tasks "${TASK_ARN}" --query 'tasks[0].lastStatus' --output text
            )"
            if [[ "${STATUS}" == "STOPPED" ]]; then
              break
            fi
            sleep 20
          done
          aws ecs describe-tasks --cluster "${CLUSTER_ARN}" \
            --tasks "${TASK_ARN}" --output json > stopped.json
          jq '{stopCode: .tasks[0].stopCode, stoppedReason: .tasks[0].stoppedReason,
               containers: [.tasks[0].containers[] | {name, exitCode, reason}]}' stopped.json
          EXIT_CODE="$(
            jq -r --arg container "${CONTAINER_NAME}" \
              '.tasks[0].containers[] | select(.name == $container) | .exitCode // -1' \
              stopped.json
          )"
          test "${EXIT_CODE}" = "0"
