name: Deploy data pipeline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "deploy/**"
      - "pipeline/**"
      - "sql/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-data-pipeline
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  SCHEDULE_NAME: ${{ vars.SCHEDULE_NAME }}
  SCHEDULE_EXPRESSION: "cron(30 8 ? * TUE-SAT *)"
  SCHEDULE_TIMEZONE: Asia/Seoul
  FMP_API_SECRET_ARN: ${{ vars.FMP_API_SECRET_ARN }}
  # The closed daily path downloads the complete evidence snapshot and runs a
  # full-history v3 return rebuild.  Start from the already established KRX
  # rebuild envelope; right-size only after a measured production soak.
  DAILY_CPU: '8192'
  DAILY_MEMORY: '49152'
  DAILY_EPHEMERAL_GIB: '120'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m compileall -q pipeline
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure deployment environment
        run: |
          set -euo pipefail

          DEFAULT_REPOSITORY="$(
            basename "${GITHUB_REPOSITORY}" \
              | tr '[:upper:]' '[:lower:]'
          )"
          AWS_ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          ECR_REPOSITORY="${ECR_REPOSITORY:-${DEFAULT_REPOSITORY}}"
          ECS_TASK_FAMILY="${ECS_TASK_FAMILY:-${DEFAULT_REPOSITORY}-daily-full}"
          CONTAINER_NAME="${CONTAINER_NAME:-${ECS_TASK_FAMILY}}"
          SCHEDULE_NAME="${SCHEDULE_NAME:-${ECS_TASK_FAMILY}-tue-sat-0830-kst}"

          {
            echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"
            echo "ECR_REPOSITORY=${ECR_REPOSITORY}"
            echo "ECS_TASK_FAMILY=${ECS_TASK_FAMILY}"
            echo "CONTAINER_NAME=${CONTAINER_NAME}"
            echo "SCHEDULE_NAME=${SCHEDULE_NAME}"
          } >> "${GITHUB_ENV}"

      - name: Require daily Scheduler to be disabled
        run: |
          set -euo pipefail

          CURRENT_SCHEDULE_STATE="$(
            aws scheduler get-schedule \
              --name "${SCHEDULE_NAME}" \
              --query State \
              --output text
          )"
          [[ "${CURRENT_SCHEDULE_STATE}" == "DISABLED" ]] || {
            echo "Refusing deploy while daily Scheduler is ${CURRENT_SCHEDULE_STATE}. Disable it before replacing the task revision." >&2
            exit 1
          }

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image
        run: |
          set -euo pipefail

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_SHA="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          IMAGE_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GITHUB_SHA must be a full 40-character commit SHA" >&2
            exit 1
          }

          docker buildx build \
            --platform linux/amd64 \
            -f deploy/Dockerfile \
            --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "SOURCE_REPOSITORY=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE_SHA}" \
            -t "${IMAGE_LATEST}" \
            --metadata-file image-metadata.json \
            --push \
            .

          IMAGE_DIGEST="$(
            jq -r '."containerimage.digest" // empty' image-metadata.json
          )"
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Buildx did not return an immutable image digest" >&2
            exit 1
          }
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "image_tag_uri=${IMAGE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image_digest=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Register ECS task definition
        id: task
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          FMP_API_SECRET_ARN: ${{ env.FMP_API_SECRET_ARN }}
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_FAMILY}" \
            --query taskDefinition \
            --output json > current-task-definition.json

          jq \
            --arg image "${IMAGE_URI}" \
            --arg container "${CONTAINER_NAME}" \
            --arg fmp_secret "${FMP_API_SECRET_ARN}" \
            --arg task_cpu "${DAILY_CPU}" \
            --arg task_memory "${DAILY_MEMORY}" \
            --argjson ephemeral_gib "${DAILY_EPHEMERAL_GIB}" \
            '
            {
              family,
              taskRoleArn,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              placementConstraints,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform,
              ephemeralStorage,
              ipcMode,
              pidMode,
              proxyConfiguration,
              inferenceAccelerators
            }
            | with_entries(select(.value != null and .value != [] and .value != {}))
            | .cpu = $task_cpu
            | .memory = $task_memory
            | .ephemeralStorage = {"sizeInGiB": $ephemeral_gib}
            | .containerDefinitions |= map(
                if .name == $container then
                  .image = $image
                  | .entryPoint = ["uv", "run", "python", "-m", "pipeline.daily_full"]
                  | .stopTimeout = 120
                  | del(.cpu, .memory, .memoryReservation)
                  | del(.command)
                  | if ($fmp_secret | length) > 0 then
                      .secrets = (
                        ((.secrets // []) | map(select(.name != "FMP_API_KEY")))
                        + [{"name":"FMP_API_KEY","valueFrom":$fmp_secret}]
                      )
                    else . end
                else
                  .
                end
              )
            ' current-task-definition.json > new-task-definition.json

          jq -e \
            --arg container "${CONTAINER_NAME}" \
            '
            .containerDefinitions[]
            | select(.name == $container)
            | (.secrets // [])
            | any(.name == "FMP_API_KEY" and (.valueFrom | length) > 0)
            ' new-task-definition.json > /dev/null || {
              echo "FMP_API_KEY secret is missing. Set FMP_API_SECRET_ARN or update the ECS task definition." >&2
              exit 1
            }

          jq -e \
            --arg cpu "${DAILY_CPU}" \
            --arg memory "${DAILY_MEMORY}" \
            --argjson ephemeral "${DAILY_EPHEMERAL_GIB}" \
            '
            .cpu == $cpu
            and .memory == $memory
            and .ephemeralStorage.sizeInGiB == $ephemeral
            ' new-task-definition.json > /dev/null || {
              echo "Closed daily task resource envelope is incomplete." >&2
              exit 1
            }

          TASK_DEFINITION_ARN="$(
            aws ecs register-task-definition \
              --cli-input-json file://new-task-definition.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "task_definition_arn=${TASK_DEFINITION_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Update EventBridge Scheduler target
        env:
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          aws scheduler get-schedule \
            --name "${SCHEDULE_NAME}" \
            --output json > current-schedule.json

          jq '.Target' current-schedule.json > current-schedule-target.json
          CURRENT_SCHEDULE_STATE="$(jq -r '.State' current-schedule.json)"
          SCHEDULE_GROUP="$(
            jq -r '.GroupName // "default"' current-schedule.json
          )"
          [[ "${CURRENT_SCHEDULE_STATE}" == "DISABLED" ]] || {
            echo "Scheduler changed during deploy: ${CURRENT_SCHEDULE_STATE}. Refusing target replacement." >&2
            exit 1
          }

          jq \
            --arg task_definition_arn "${TASK_DEFINITION_ARN}" \
            '.EcsParameters.TaskDefinitionArn = $task_definition_arn
             | .EcsParameters.TaskCount = 1
             | .RetryPolicy = {
                 "MaximumEventAgeInSeconds": 86400,
                 "MaximumRetryAttempts": 0
               }' \
            current-schedule-target.json > new-schedule-target.json

          jq -e '
            .EcsParameters.TaskCount == 1
            and .RetryPolicy.MaximumRetryAttempts == 0
          ' new-schedule-target.json > /dev/null || {
            echo "Daily Scheduler must launch one task with no Scheduler retry overlap." >&2
            exit 1
          }

          aws scheduler update-schedule \
            --name "${SCHEDULE_NAME}" \
            --group-name "${SCHEDULE_GROUP}" \
            --schedule-expression "${SCHEDULE_EXPRESSION}" \
            --schedule-expression-timezone "${SCHEDULE_TIMEZONE}" \
            --flexible-time-window '{"Mode":"OFF"}' \
            --target file://new-schedule-target.json \
            --state DISABLED

      - name: Show deployed version
        run: |
          aws scheduler get-schedule \
            --name "${SCHEDULE_NAME}" \
            --query '{name:Name,state:State,expression:ScheduleExpression,timezone:ScheduleExpressionTimezone,taskDefinition:Target.EcsParameters.TaskDefinitionArn}' \
            --output table
