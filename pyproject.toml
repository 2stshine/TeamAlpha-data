[project]
name = "teamalpha-data"
version = "0.1.0"
description = "KRX·DART·FMP Bronze/Silver와 Gold 팩터를 운영하는 배치 데이터 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "boto3",
    "python-dotenv",
    "requests",
    "psycopg[binary]",
    "exchange-calendars>=4.11,<5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
